name: Android APK Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.variant }} APK
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [mobile, tv]
    env:
      APP_VARIANT: ${{ matrix.variant }}
      APP_VERSION: ${{ github.event.release.tag_name && github.event.release.tag_name || '0.1.0' }}
      RELEASE_NOTES: ${{ github.event.release.body || 'Hallyu Android release.' }}
      APP_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Unit tests
        run: bun test

      - name: Typecheck
        run: bun run typecheck

      - name: Validate release signing secrets
        if: github.event_name == 'release'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64 GitHub Secret" && exit 1)
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD GitHub Secret" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS GitHub Secret" && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD GitHub Secret" && exit 1)
          mkdir -p "$RUNNER_TEMP/hallyu-signing"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hallyu-signing/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/hallyu-signing/release.keystore" >> "$GITHUB_ENV"

      - name: Expo prebuild
        run: bunx expo prebuild -p android --clean --no-install

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.ANDROID_KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Name and inspect APK
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          if [ "$APP_VARIANT" = "tv" ]; then EXPECTED=app.hallyutv.dev; NAME=hallyu-tv.apk; else EXPECTED=app.hallyu.mobile; NAME=hallyu-mobile.apk; fi
          mkdir -p artifacts
          cp "$APK" "artifacts/$NAME"
          echo "Expected package: $EXPECTED"
          ls -lh "artifacts/$NAME"

      - name: Create variant manifest
        run: node scripts/create-update-manifest.mjs "artifacts/hallyu-${APP_VARIANT}.apk"

      - name: Move manifest to artifact folder
        run: mv "${APP_VARIANT}-update.json" artifacts/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hallyu-${{ matrix.variant }}-release
          path: artifacts/*
          if-no-files-found: error

      - name: Publish APK and manifest to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "artifacts/hallyu-${APP_VARIANT}.apk" "artifacts/${APP_VARIANT}-update.json" --clobber
