name: Backend Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Daily drift check on the provider + control plane.
    - cron: "0 6 * * *"

jobs:
  verify:
    name: Provider API + Supabase contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # .env is not tracked; scripts fall back to the committed public .env.example
      - name: Restore public env config
        run: cp .env.example .env

      # bun runs the script AND the app's own TS normalization module it imports.
      - name: Verify provider API contract (app normalization rules)
        run: bun scripts/verify-provider.mjs

      - name: Verify Supabase control plane
        run: node scripts/verify-backend.mjs
